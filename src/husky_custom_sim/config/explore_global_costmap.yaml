# Global Costmap for Exploration Mode
# Unlike navigation mode (static map), exploration uses a rolling window
# because the map is being built in real time — there is no pre-built map to load.

global_costmap:
  global_frame: map
  robot_base_frame: base_link

  update_frequency: 1.0
  publish_frequency: 1.0

  transform_tolerance: 1.0

  # No static map — slam_toolbox publishes /map live
  static_map: false

  # Rolling window follows the robot as it explores
  rolling_window: true
  width: 10.0
  height: 10.0
  resolution: 0.05

  plugins:
    - {name: obstacle_layer,  type: "costmap_2d::ObstacleLayer"}
    - {name: inflation_layer, type: "costmap_2d::InflationLayer"}

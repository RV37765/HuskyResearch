# Global Costmap for Exploration Mode
# Unlike navigation mode (static map), exploration uses a rolling window
# because the map is being built in real time — there is no pre-built map to load.

global_costmap:
  global_frame: map
  robot_base_frame: base_link

  update_frequency: 1.0
  publish_frequency: 1.0

  transform_tolerance: 1.0

  # Use slam_toolbox's live /map topic as the static layer.
  # This gives explore_lite the unknown (-1) cells it needs to find frontiers.
  static_map: false
  rolling_window: false

  plugins:
    - {name: static_layer,    type: "costmap_2d::StaticLayer"}
    - {name: obstacle_layer,  type: "costmap_2d::ObstacleLayer"}
    - {name: inflation_layer, type: "costmap_2d::InflationLayer"}

static_layer:
  map_topic: /map
  subscribe_to_updates: true

# Costmap Common Parameters
# Shared by both the global and local costmaps.
# Defines the robot's physical size and what sensor data to use.

# --- Robot footprint ---
# The Husky is roughly 0.98m long x 0.67m wide.
# footprint is a polygon (list of [x,y] corners) describing the robot's shape.
# The planner uses this to know "how much space does the robot need to fit through?"
footprint: [[-0.49, -0.34], [-0.49, 0.34], [0.49, 0.34], [0.49, -0.34]]

# --- Sensor sources ---
# This tells the costmap: "listen to the /scan topic to learn about obstacles."
# observation_sources lists named sources; each one is configured below.
observation_sources: scan

# "scan" source configuration:
scan:
  topic: /scan_fixed              # Use corrected scan from scan_relay.py (fixes VLP-16 897/898 header mismatch)
  data_type: LaserScan            # Type of message (not PointCloud2)
  marking: true                   # YES, use this data to mark cells as "obstacle"
  clearing: true                  # YES, use this data to clear cells as "free space"
  sensor_frame: base_link         # The TF frame the scan is in (our pointcloud_to_laserscan outputs in base_link)
  observation_persistence: 0.0    # Don't keep old observations — only use the latest scan

# --- Inflation ---
# inflation_radius: how far from an obstacle to start adding "cost" (meters).
# Bigger = robot stays further from walls. Too big = robot can't fit through doorways.
# Reduced to 0.35m because the hallway corridors are narrow (~2m wide).
# At 0.55m the inflation zones from opposite walls overlapped, leaving almost
# no navigable space. 0.35m still provides buffer but lets the planner find paths.
inflation_radius: 0.35

# cost_scaling_factor: how steeply the cost drops off with distance from obstacles.
# Higher = cost drops off faster (robot is more willing to get close to walls).
# Lower = cost drops off slowly (robot gives walls a wide berth).
# Increased to 5.0 so cost drops off quickly — the robot treats space more than
# ~0.35m from walls as fully safe, which helps in tight corridors.
cost_scaling_factor: 5.0

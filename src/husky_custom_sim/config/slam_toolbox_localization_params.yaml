# SLAM Toolbox Localization Parameters
# Used during navigation (not mapping) — localizes on a saved serialized map.
# The key difference from slam_toolbox_params.yaml: mode is localization, not mapping.

solver_plugin: solver_plugins::CeresSolver
ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
ceres_preconditioner: SCHUR_JACOBI
ceres_trust_strategy: LEVENBERG_MARQUARDT
ceres_dogleg_type: TRADITIONAL_DOGLEG
ceres_loss_function: None

odom_frame: odom
map_frame: map
base_frame: base_link

# Use the corrected scan from scan_relay (fixes VLP-16 897/898 header mismatch)
scan_topic: /scan_fixed
scan_queue_size: 1
use_scan_matching: true
use_scan_barycenter: true

minimum_time_interval: 0.5
transform_timeout: 0.5
tf_buffer_duration: 30.0

resolution: 0.05
max_laser_range: 12.0
minimum_travel_distance: 0.1
minimum_travel_heading: 0.1

# Localization mode — does not modify or extend the map
mode: localization

stack_size_to_use: 40000000
